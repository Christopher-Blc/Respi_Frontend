<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResPi - Verificar email</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --ok: #2ed573;
            --err: #ff4757;
            --btn: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 10% 10%, #1d4ed8 0%, transparent 60%),
                radial-gradient(1000px 500px at 90% 90%, #0ea5e9 0%, transparent 60%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2));
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            border-radius: 18px;
            padding: 24px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.6rem;
        }

        .status {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .status.ok {
            color: var(--ok);
        }

        .status.error {
            color: var(--err);
        }

        .actions {
            margin-top: 18px;
            display: none;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            background: var(--btn);
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Verificacion de email</h1>
        <p id="status" class="status">Validando enlace...</p>

        <div id="actions" class="actions">
            <button id="openApp" class="btn" type="button">Abrir ResPi</button>
            <p class="hint">
                Si no se abre la app, instala la ultima version o abre el enlace desde tu movil.
            </p>
        </div>
    </main>

    <script>
        (function () {
            var BACKEND_BASE_URL = "https://respi.es/api";
            var VERIFY_PATH = "/auth/verify-email";

            var statusEl = document.getElementById("status");
            var actionsEl = document.getElementById("actions");
            var openAppBtn = document.getElementById("openApp");

            var params = new URLSearchParams(window.location.search);
            var token = params.get("token");

            if (!token) {
                statusEl.textContent = "Token no encontrado en la URL.";
                statusEl.classList.add("error");
                return;
            }

            var appUrl = "respi-app://verify-email?token=" + encodeURIComponent(token);

            function showOpenAppButton() {
                actionsEl.style.display = "block";
                openAppBtn.onclick = function () {
                    window.location.href = appUrl;
                };
            }

            async function verifyToken() {
                try {
                    var getUrl =
                        BACKEND_BASE_URL + VERIFY_PATH + "?token=" + encodeURIComponent(token);

                    var response = await fetch(getUrl, {
                        method: "GET",
                        headers: {
                            Accept: "application/json",
                        },
                    });

                    if (!response.ok) {
                        var postResponse = await fetch(BACKEND_BASE_URL + VERIFY_PATH, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Accept: "application/json",
                            },
                            body: JSON.stringify({ token: token }),
                        });

                        if (!postResponse.ok) {
                            var errorText = "No se pudo verificar tu email.";
                            try {
                                var errorJson = await postResponse.json();
                                if (errorJson && errorJson.message) {
                                    errorText = Array.isArray(errorJson.message)
                                        ? errorJson.message[0]
                                        : errorJson.message;
                                }
                            } catch (_error) {
                                // Ignore JSON parse issues and keep fallback message.
                            }
                            throw new Error(errorText);
                        }
                    }

                    statusEl.textContent =
                        "Email verificado correctamente. Pulsa para volver a ResPi.";
                    statusEl.classList.add("ok");
                    showOpenAppButton();
                } catch (error) {
                    statusEl.textContent =
                        (error && error.message) ||
                        "Error verificando el email. Intentalo de nuevo en unos minutos.";
                    statusEl.classList.add("error");
                    showOpenAppButton();
                }
            }

            verifyToken();
        })();
    </script>
</body>

</html>
